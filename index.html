<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KOL 推文精选目录</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 图标库 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Inter 字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    /* 卡片悬浮过渡效果 */
    .tweet-card-item {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .tweet-card-item:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="bg-slate-50/80 text-slate-800 min-h-screen flex flex-col antialiased">

  <!-- 顶部 Header -->
  <header class="bg-white/90 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200/80">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      
      <!-- 品牌/标题 -->
      <div class="flex items-center gap-3 w-full sm:w-auto">
        <div class="w-10 h-10 rounded-full bg-slate-900 flex items-center justify-center text-white shrink-0 shadow-sm">
          <i class="fa-brands fa-x-twitter text-lg"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-900 leading-tight">KOL 推文精选目录</h1>
          <p class="text-xs text-slate-500">精选 Twitter/X 优质深度长文与干货</p>
        </div>
      </div>

      <!-- 实时搜索框 -->
      <div class="relative w-full sm:w-72">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="搜索主题、作者或 @handle..." 
          class="w-full bg-slate-100/80 hover:bg-slate-100 focus:bg-white border border-transparent focus:border-slate-300 text-slate-800 text-xs rounded-full pl-9 pr-8 py-2.5 outline-none transition-all duration-200 placeholder-slate-400"
          oninput="filterTweets()"
        >
        <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-xs">
          <i class="fa-solid fa-circle-xmark"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- 主体内容 (单排单列居中布局) -->
  <main class="max-w-3xl w-full mx-auto px-4 sm:px-6 py-8 flex-1">

    <!-- 分类 Filter 标签按钮 -->
    <div class="flex items-center gap-2 overflow-x-auto pb-2 mb-6 scrollbar-none" id="categoryContainer">
      <!-- 分类按钮由 JS 渲染 -->
    </div>

    <!-- 列表统计与排序信息 -->
    <div class="flex items-center justify-between text-xs text-slate-500 mb-4 px-1">
      <div class="flex items-center gap-1.5 font-medium">
        <span>已为您筛选出</span>
        <span id="tweetCount" class="bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full text-[11px] font-bold">0</span>
        <span>篇精选文章</span>
      </div>
      <span class="text-slate-400">点击卡片直接跳转原文</span>
    </div>

    <!-- 单排推文列表容器 -->
    <div id="tweetContainer" class="flex flex-col gap-3.5">
      <!-- 推文卡片列表将由 JS 动态填充 -->
    </div>

  </main>

  <!-- 页脚 Footer -->
  <footer class="border-t border-slate-200 bg-white py-6 mt-12 text-center text-xs text-slate-400">
    <p>© 2026 Twitter/X KOL 精选集 · 持续更新中</p>
  </footer>

  <script>
    // 注意：无需手动维护数组顺序，渲染时会自动按 date 倒序排列（最新在最上）
    const tweetsData = [
      {
        id: 1,
        title: "LP 本身、单边接货、持币，以及接货以后再做一轮 LP，其实是几种不同的策略 ",
        authorName: "辣目晴子",
        authorHandle: "@qingerqq2024",
        avatar: "https://pbs.twimg.com/profile_images/1976207948285415424/ZbBMbJgi_400x400.jpg",
        url: "https://x.com/qingerqq2024/status/2103751994372751758",
        category: "LP教程",
        date: "2026-09-26"
      },
      {
        id: 2,
        title: "要多少钱才能躺平？",
        authorName: "努力赚钱的菜狗",
        authorHandle: "@jiroucaigou",
        avatar: "https://pbs.twimg.com/profile_images/1985943339926241282/T3UuWjH3_400x400.jpg",
        url: "https://x.com/jiroucaigou/status/2104486135120687373",
        category: "LP教程",
        date: "2026-09-28"
      },
      {
        id: 3,
        title: "做了一个个人加密项目信息追踪工具，叫 Signal",
        authorName: "詹姆斯叉",
        authorHandle: "@james_x",
        avatar: "https://pbs.twimg.com/profile_images/2096453761208315904/9XwjTjM4_400x400.jpg",
        url: "https://x.com/james_x/status/2104215523164877283",
        category: "AI工具",
        date: "2026-09-27"
      },
      {
        id: 4,
        title: "2万U做LP，真的能躺平吗？-----LP入门篇",
        authorName: "辣目晴子",
        authorHandle: "@qingerqq2024",
        avatar: "https://pbs.twimg.com/profile_images/1976207948285415424/ZbBMbJgi_400x400.jpg",
        url: "https://x.com/qingerqq2024/status/2104772586005823976",
        category: "LP教程",
        date: "2026-09-29"
      },
      {
        id: 5,
        title: "去中心化金融（DeFi）生态最新发展趋势深度研报与收益策略剖析",
        authorName: "Web3 Alpha",
        authorHandle: "@crypto_alpha",
        avatar: "https://placehold.co/100x100/10b981/ffffff?text=W",
        url: "https://x.com",
        category: "加密货币",
        date: "2026-03-05"
      },
      {
        id: 6,
        title: "普通人如何建立个人数字资产与 Twitter/X 社交影响力：10 个实用的长期主义运营心法",
        authorName: "晴儿",
        authorHandle: "@qingerqq2024",
        avatar: "https://placehold.co/100x100/0f172a/ffffff?text=Q",
        url: "https://x.com/qingerqq2024",
        category: "副业思考",
        date: "2026-02-28"
      }
    ];

    // 分类列表
    const categories = ['全部', 'AI干货', 'AI工具', 'LP教程','副业思考', '前端/开发', '加密货币'];
    let currentCategory = '全部';

    // 按发布日期倒序排序工具函数（最新在前，不修改原数组）
    // date 为 YYYY-MM-DD 格式，字符串比较等价于日期比较
    function sortByDateDesc(list) {
      return list.slice().sort((a, b) => b.date.localeCompare(a.date));
    }

    // 初始化分类按钮
    function renderCategoryButtons() {
      const container = document.getElementById('categoryContainer');
      container.innerHTML = categories.map(cat => `
        <button 
          onclick="selectCategory('${cat}')" 
          class="category-btn px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-all duration-200 cursor-pointer ${
            currentCategory === cat 
              ? 'bg-slate-900 text-white shadow-sm ring-2 ring-slate-900 ring-offset-1' 
              : 'bg-white text-slate-600 hover:bg-slate-100 hover:text-slate-900 border border-slate-200/80'
          }"
        >
          ${cat}
        </button>
      `).join('');
    }

    // 渲染单列推文列表
    function renderTweets(list) {
      const container = document.getElementById('tweetContainer');
      document.getElementById('tweetCount').innerText = list.length;

      if (list.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl border border-slate-200/80 py-16 px-4 text-center">
            <div class="w-12 h-12 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-3">
              <i class="fa-solid fa-inbox text-xl"></i>
            </div>
            <p class="text-slate-600 text-sm font-medium mb-1">未找到相关推文</p>
            <p class="text-slate-400 text-xs">尝试搜索其他关键词或选择不同分类</p>
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(item => `
        <a href="${item.url}" target="_blank" rel="noopener noreferrer" 
           class="tweet-card-item group block bg-white rounded-xl border border-slate-200/80 p-4 sm:p-5 shadow-sm hover:shadow-md hover:border-slate-300 transition-all duration-200">
          
          <!-- 卡片顶部：作者 + 分类 Badge + 日期 -->
          <div class="flex items-center justify-between gap-2 mb-3">
            <div class="flex items-center gap-2.5 min-w-0">
              <img src="${item.avatar}" alt="${item.authorName}" class="w-7 h-7 rounded-full object-cover shrink-0 ring-1 ring-slate-200">
              <div class="flex items-center gap-1.5 truncate">
                <span class="text-xs font-semibold text-slate-900 truncate">${item.authorName}</span>
                <span class="text-[11px] text-slate-400 truncate">${item.authorHandle}</span>
              </div>
            </div>

            <div class="flex items-center gap-2 shrink-0">
              <span class="text-[11px] font-medium px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600 border border-slate-200/60">
                ${item.category}
              </span>
              <span class="text-[11px] text-slate-400 hidden sm:inline-block">${item.date}</span>
            </div>
          </div>

          <!-- 卡片中部：推文标题 -->
          <div class="mb-3">
            <h2 class="text-sm sm:text-base font-semibold text-slate-800 group-hover:text-sky-600 leading-snug transition-colors">
              ${item.title}
            </h2>
          </div>

          <!-- 卡片底部：底部操作栏与外链提示 -->
          <div class="flex items-center justify-between pt-2.5 border-t border-slate-100 text-[11px] text-slate-400">
            <span class="sm:hidden">${item.date}</span>
            <span class="hidden sm:inline-block text-slate-400 group-hover:text-slate-600">Twitter / X 深度推文</span>
            <span class="text-slate-400 group-hover:text-sky-600 font-medium flex items-center gap-1 ml-auto transition-colors">
              阅读全文 <i class="fa-solid fa-arrow-up-right-from-square text-[10px] transform group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform"></i>
            </span>
          </div>

        </a>
      `).join('');
    }

    // 筛选逻辑 (关键词 + 分类)
    function filterTweets() {
      const searchInput = document.getElementById('searchInput');
      const clearSearchBtn = document.getElementById('clearSearchBtn');
      const keyword = searchInput.value.toLowerCase().trim();

      if (keyword.length > 0) {
        clearSearchBtn.classList.remove('hidden');
      } else {
        clearSearchBtn.classList.add('hidden');
      }

      const filtered = tweetsData.filter(item => {
        const matchesCategory = (currentCategory === '全部') || (item.category === currentCategory);
        const matchesKeyword = item.title.toLowerCase().includes(keyword) || 
                               item.authorName.toLowerCase().includes(keyword) ||
                               item.authorHandle.toLowerCase().includes(keyword);
        return matchesCategory && matchesKeyword;
      });

      renderTweets(sortByDateDesc(filtered));
    }

    // 选择分类
    function selectCategory(category) {
      currentCategory = category;
      renderCategoryButtons();
      filterTweets();
    }

    // 清空搜索
    function clearSearch() {
      const searchInput = document.getElementById('searchInput');
      searchInput.value = '';
      filterTweets();
      searchInput.focus();
    }

    // 初始渲染（已按日期倒序，最新的排最上面）
    renderCategoryButtons();
    renderTweets(sortByDateDesc(tweetsData));
  </script>
</body>
</html>
